<style>
:root {
  --bg: #04040c;
  --panel: rgba(10,14,30,0.62);
  --panel-2: rgba(14,20,40,0.55);
  --border: rgba(80,220,255,0.22);
  --border-hot: rgba(255,60,200,0.5);
  --cyan: #22e0ff;
  --magenta: #ff3cc8;
  --lime: #5cff9d;
  --violet: #b26bff;
  --amber: #ffcf4d;
  --text: #d6f5ff;
  --muted: #6d84a6;
  --mono: 'Share Tech Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  --display: 'Orbitron', var(--mono);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.55;
  position: relative;
}

/* ── Bright animated neon background ────────────────────────── */
.bg-aurora { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.55; mix-blend-mode: screen; }
.blob.c1 { width: 46vw; height: 46vw; background: var(--cyan);    top: -12vh; left: -8vw;  animation: drift1 18s ease-in-out infinite; }
.blob.c2 { width: 40vw; height: 40vw; background: var(--magenta); top: -6vh;  right: -10vw; animation: drift2 22s ease-in-out infinite; }
.blob.c3 { width: 38vw; height: 38vw; background: var(--violet);  bottom: -14vh; left: 20vw; animation: drift3 26s ease-in-out infinite; }
.blob.c4 { width: 30vw; height: 30vw; background: var(--lime);    bottom: -10vh; right: 8vw; animation: drift1 20s ease-in-out infinite reverse; }
@keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(6vw,5vh) scale(1.15); } }
@keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-5vw,7vh) scale(1.1); } }
@keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4vw,-6vh) scale(1.2); } }
/* CRT scanlines */
.scanlines { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 2px, transparent 3px);
  opacity: 0.5; }
.vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0,0,0,0.55) 100%); }

#app { display: flex; flex-direction: column; height: 100vh; max-width: 920px; margin: 0 auto; position: relative; z-index: 1; }

.glass { background: var(--panel); backdrop-filter: blur(14px) saturate(150%); -webkit-backdrop-filter: blur(14px) saturate(150%); border: 1px solid var(--border); }

/* ── Header ─────────────────────────────────────────────────── */
.header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 62px; flex-shrink: 0;
  border-bottom: 1px solid var(--border); background: rgba(4,4,12,0.7); backdrop-filter: blur(12px); }
.hl { display: flex; align-items: center; gap: 12px; }
.logo-mark { width: 32px; height: 32px; filter: drop-shadow(0 0 7px var(--cyan)); animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { filter: drop-shadow(0 0 4px var(--cyan)); } 50% { filter: drop-shadow(0 0 12px var(--magenta)); } }
.brand { font-family: var(--display); font-weight: 900; font-size: 19px; letter-spacing: 3px;
  background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.sys { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
.sys b { color: var(--lime); }
.badge { display: flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: 1.5px; color: var(--lime);
  border: 1px solid rgba(92,255,157,0.4); padding: 3px 8px; border-radius: 3px; text-transform: uppercase; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 7px var(--lime); animation: blink 1.5s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
.caps { display: flex; gap: 6px; }
.cap { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); padding: 2px 8px; border-radius: 3px; letter-spacing: 0.5px; }
.hbtns { display: flex; gap: 8px; }
.hbtn { font-family: var(--mono); background: rgba(34,224,255,0.08); border: 1px solid var(--border); color: var(--cyan);
  font-size: 11px; letter-spacing: 1px; padding: 7px 12px; border-radius: 4px; cursor: pointer; text-transform: uppercase; transition: all .15s; }
.hbtn:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(34,224,255,0.3); }
.hbtn.hot { color: var(--magenta); border-color: var(--border-hot); background: rgba(255,60,200,0.09); }
.hbtn.hot:hover { box-shadow: 0 0 14px rgba(255,60,200,0.4); }
.hbtn.ghost { color: var(--muted); background: transparent; }

/* ── Chat ───────────────────────────────────────────────────── */
.chat { flex: 1; overflow-y: auto; padding: 26px 18px; display: flex; flex-direction: column; gap: 16px; }
.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-thumb { background: rgba(34,224,255,0.25); border-radius: 3px; }
.msg { display: flex; flex-direction: column; gap: 4px; }
.msg.user { align-items: flex-end; }
.msg.shelby { align-items: flex-start; }
.who { font-size: 9.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding: 0 3px; }
.msg.user .who { color: var(--cyan); }
.msg.shelby .who { color: var(--magenta); }
.bubble { max-width: min(82%, 660px); padding: 12px 15px; border-radius: 4px; font-size: 14px; line-height: 1.7; word-break: break-word; }
.msg.user .bubble { background: rgba(34,224,255,0.08); border: 1px solid rgba(34,224,255,0.3); border-right: 3px solid var(--cyan); }
.msg.shelby .bubble { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--magenta); backdrop-filter: blur(10px); }
.meta { font-size: 9.5px; color: var(--muted); padding-left: 3px; letter-spacing: 0.5px; }

/* Markdown */
.bubble strong { color: #fff; } .bubble em { color: var(--cyan); font-style: italic; }
.bubble h1,.bubble h2,.bubble h3 { font-family: var(--display); letter-spacing: 1px; margin: 10px 0 5px; color: #fff; }
.bubble h1 { font-size: 1.1em; } .bubble h2 { font-size: 1.04em; } .bubble h3 { font-size: 1em; }
.bubble ul,.bubble ol { padding-left: 20px; margin: 6px 0; } .bubble li { margin: 3px 0; } .bubble p { margin: 6px 0; }
.bubble code { background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; color: var(--lime); }
.bubble pre { background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 4px; padding: 13px 15px; margin: 9px 0; overflow-x: auto; }
.bubble pre code { background: none; border: none; padding: 0; color: var(--lime); }
.bubble a { color: var(--cyan); } .bubble hr { border: none; border-top: 1px solid var(--border); margin: 11px 0; }
.bubble blockquote { border-left: 3px solid var(--cyan); padding: 3px 11px; margin: 6px 0; color: var(--muted); }

/* ── Thinking / emblem ──────────────────────────────────────── */
.think { display: flex; align-items: center; gap: 13px; padding: 4px; }
.stage { position: relative; width: 50px; height: 50px; display: grid; place-items: center; flex-shrink: 0; }
.ring { position: absolute; inset: -3px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent, var(--cyan), var(--magenta), transparent 75%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
  animation: spin 1.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.core { width: 36px; height: 36px; z-index: 2; animation: pg 1.1s ease-in-out infinite; }
@keyframes pg { 0%,100% { filter: drop-shadow(0 0 3px var(--cyan)); } 50% { filter: drop-shadow(0 0 11px var(--magenta)); } }
.core .eye { animation: fl 1.1s ease-in-out infinite; } @keyframes fl { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
.tlabel { font-size: 12.5px; letter-spacing: 1px; color: var(--cyan);
  background: linear-gradient(90deg, var(--muted), #fff, var(--muted)); background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: sh 2.2s linear infinite; }
@keyframes sh { to { background-position: -200% center; } }
.tlabel::before { content: "> "; }

/* ── Scorecard / file report ────────────────────────────────── */
.card { max-width: min(90%, 660px); border-radius: 5px; padding: 17px 19px; }
.card .ct { font-family: var(--display); font-size: 13px; letter-spacing: 1.5px; color: #fff; text-transform: uppercase; }
.card .cs { font-size: 11px; color: var(--muted); margin: 4px 0 15px; }
.ov { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
.ovn { font-family: var(--display); font-size: 28px; font-weight: 900; }
.ovn .f { color: var(--muted); } .ovn .a { color: var(--magenta); margin: 0 7px; } .ovn .t { color: var(--lime); text-shadow: 0 0 12px rgba(92,255,157,0.5); }
.delta { font-size: 11px; letter-spacing: 1px; color: var(--lime); border: 1px solid rgba(92,255,157,0.4); padding: 3px 8px; border-radius: 3px; }
.row { display: grid; grid-template-columns: 104px 1fr 40px; align-items: center; gap: 10px; margin: 8px 0; }
.dim { font-size: 11px; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px; }
.track { height: 9px; border-radius: 2px; background: rgba(0,0,0,0.5); overflow: hidden; border: 1px solid var(--border); }
.fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--magenta)); box-shadow: 0 0 9px rgba(34,224,255,0.6); transition: width 1.05s cubic-bezier(.2,.8,.2,1); }
.rv { font-size: 11px; text-align: right; color: var(--text); }
.defs { margin-top: 11px; font-size: 11px; color: var(--muted); list-style: none; }
.defs li { margin: 4px 0; } .defs li::before { content: "✗ "; color: var(--magenta); }
.foot { margin-top: 13px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 11px; }
.foot b { color: var(--lime); }
.kv { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 12px; }
.kv div { font-size: 12px; } .kv span { color: var(--cyan); font-family: var(--display); font-size: 15px; }

/* ── Input bar ──────────────────────────────────────────────── */
.inbar { display: flex; align-items: flex-end; gap: 9px; padding: 12px 16px 15px; border-top: 1px solid var(--border);
  background: rgba(4,4,12,0.72); backdrop-filter: blur(12px); flex-shrink: 0; }
.prompt { color: var(--lime); font-size: 18px; padding-bottom: 12px; }
#input { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 4px; color: var(--text);
  font-family: var(--mono); font-size: 14px; line-height: 1.5; padding: 11px 13px; resize: none; outline: none; min-height: 46px; max-height: 130px; transition: all .15s; }
#input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(34,224,255,0.16); }
#input::placeholder { color: var(--muted); }
.iobtn { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border); background: rgba(0,0,0,0.4); color: var(--cyan);
  cursor: pointer; display: grid; place-items: center; flex-shrink: 0; transition: all .15s; }
.iobtn:hover { border-color: var(--cyan); box-shadow: 0 0 10px rgba(34,224,255,0.3); }
.iobtn svg { width: 18px; height: 18px; }
.iobtn.rec { color: var(--magenta); border-color: var(--border-hot); animation: recpulse 1s ease-in-out infinite; }
@keyframes recpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,60,200,0.5); } 50% { box-shadow: 0 0 0 6px rgba(255,60,200,0); } }
#send { background: linear-gradient(135deg, var(--cyan), var(--magenta)); border: none; color: #04040c; box-shadow: 0 0 16px rgba(34,224,255,0.35); }
#send:disabled { opacity: .35; box-shadow: none; cursor: not-allowed; }
.hint { text-align: center; font-size: 10px; color: var(--muted); padding: 0 16px 8px; letter-spacing: 0.5px; flex-shrink: 0; }
.hint b { color: var(--cyan); }

@media (max-width: 640px) { .caps { display: none; } .sys { display: none; } .bubble, .card { max-width: 94%; } .brand { font-size: 16px; } }
</style>

<script type="module">
/* Motion — Framer's spring-physics engine (vanilla). Degrades gracefully if the CDN is unreachable. */
let animate = null;
try {
  const m = await import("https://esm.sh/motion@11.11.13");
  animate = m.animate;
} catch (e) { console.warn("Motion unavailable — using CSS fallbacks", e); }
function spring(el, kf, opts) {
  if (!el) return;
  if (animate) { try { animate(el, kf, { type: "spring", stiffness: 320, damping: 26, ...opts }); return; } catch (e) {} }
  // CSS fallback: apply the end-state instantly
  if (kf.opacity) el.style.opacity = Array.isArray(kf.opacity) ? kf.opacity.at(-1) : kf.opacity;
  if (kf.y != null) el.style.transform = "none";
}

const WELCOME = [
  "**SHELBY OS v1.0** — Claude-powered field agent. Booted and operational.",
  "",
  "I don't return *NULL* — I have live web access and query it before I answer.",
  "",
  "**CAPABILITIES:**",
  "- `web.search()` — real-time web via Tavily",
  "- `memory.rw()` — I learn and persist across sessions",
  "- `skills.exec()` — I write & run Python to solve novel problems",
  "- `data.repair()` — inspect → clean → score broken datasets (the real FDE loop)",
  "",
  "**INPUT MODES:** type · 📎 upload a CSV to inspect · 🎤 speak",
  "",
  "Run **⚡ DATA-QC DEMO** to watch me take a broken enterprise dataset from a failing score to 100 — or issue any query.",
].join("\n");

let history = [], loading = false;

/* ── Markdown ───────────────────────────────────────────────── */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function md(raw){
  const B=[]; let t=raw.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{const i=B.length;B.push({l,c});return `\x02${i}\x02`;});
  t=esc(t); const I=[]; t=t.replace(/`([^`\n]+)`/g,(_,c)=>{const i=I.length;I.push(`<code>${esc(c)}</code>`);return `\x03${i}\x03`;});
  const L=t.split('\n'),o=[]; let ul=false;
  for(const ln of L){const s=ln.trim();
    if(/^### /.test(s)){if(ul){o.push('</ul>');ul=false;}o.push(`<h3>${s.slice(4)}</h3>`);continue;}
    if(/^## /.test(s)){if(ul){o.push('</ul>');ul=false;}o.push(`<h2>${s.slice(3)}</h2>`);continue;}
    if(/^# /.test(s)){if(ul){o.push('</ul>');ul=false;}o.push(`<h1>${s.slice(2)}</h1>`);continue;}
    if(/^(---|\*\*\*)$/.test(s)){if(ul){o.push('</ul>');ul=false;}o.push('<hr>');continue;}
    const b=s.match(/^[-*•+] (.+)/); if(b){if(!ul){o.push('<ul>');ul=true;}o.push(`<li>${b[1]}</li>`);continue;}
    const n=s.match(/^\d+\. (.+)/); if(n){if(!ul){o.push('<ul>');ul=true;}o.push(`<li>${n[1]}</li>`);continue;}
    if(ul&&!s){o.push('</ul>');ul=false;}
    if(/^&gt; /.test(s)){o.push(`<blockquote>${s.slice(5)}</blockquote>`);continue;}
    o.push(ln);
  }
  if(ul)o.push('</ul>'); t=o.join('\n');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  t=t.replace(/\n/g,'<br>').replace(/\x03(\d+)\x03/g,(_,i)=>I[i]).replace(/\x02(\d+)\x02/g,(_,i)=>`<pre><code>${esc(B[i].c.replace(/\n$/,''))}</code></pre>`);
  return t.replace(/<br>\s*(<(?:ul|ol|li|h[1-6]|pre|blockquote|hr)[^>]*>)/g,'$1').replace(/(<\/(?:ul|ol|li|h[1-6]|pre|blockquote)>)\s*<br>/g,'$1');
}

/* ── DOM ────────────────────────────────────────────────────── */
const chat=document.getElementById('chat');
const sb=()=>{chat.scrollTop=chat.scrollHeight;};
function add(role,htmlStr,meta){
  const w=document.createElement('div'); w.className=`msg ${role}`;
  const who=document.createElement('div'); who.className='who'; who.textContent=role==='user'?'// operator':'// shelby'; w.appendChild(who);
  const b=document.createElement('div'); b.className='bubble';
  if(role==='shelby')b.innerHTML=htmlStr; else b.textContent=htmlStr; w.appendChild(b);
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;w.appendChild(m);}
  chat.appendChild(w); sb();
  spring(w,{opacity:[0,1],y:[10,0]},{});
  return w;
}
const embSVG=`<div class="stage"><div class="ring"></div><svg class="core"><use href="#emb"/></svg></div>`;
function think(label){
  const w=document.createElement('div'); w.className='msg shelby'; w.id='think';
  w.innerHTML=`<div class="think">${embSVG}<span class="tlabel">${label||'processing'}</span></div>`;
  chat.appendChild(w); sb(); return w;
}
const unthink=()=>document.getElementById('think')?.remove();

/* ── Chat ───────────────────────────────────────────────────── */
const input=document.getElementById('input'), sendBtn=document.getElementById('send');
async function send(){
  if(loading)return; const text=input.value.trim(); if(!text)return;
  input.value=''; input.style.height='auto';
  add('user',text); history.push({role:'user',content:text});
  think('processing query'); loading=true; setBusy(true);
  const slow=setTimeout(()=>{const l=document.querySelector('#think .tlabel');if(l)l.textContent='invoking tools // searching';},6000);
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,stream:false})});
    clearTimeout(slow); unthink();
    if(!r.ok){const x=await r.text().catch(()=>r.statusText);throw new Error(`${r.status} ${x.slice(0,180)}`);}
    const d=await r.json(); add('shelby',md(d.reply),`model: ${d.model}`); history.push({role:'assistant',content:d.reply});
  }catch(e){clearTimeout(slow);unthink();add('shelby',`<strong>⚠ ERROR</strong><br>${esc(String(e))}`);}
  finally{loading=false;setBusy(false);input.focus();}
}
function setBusy(b){sendBtn.disabled=b;}

/* ── Data-QC demo ───────────────────────────────────────────── */
async function demo(){
  if(loading)return; loading=true; setBusy(true); document.getElementById('demo-btn').disabled=true;
  add('user','run data-qc demo');
  think('inspect → repair → score // broken dataset');
  try{
    const r=await fetch('/demo/dataquality'); unthink();
    if(!r.ok)throw new Error(`${r.status}`);
    scorecard(await r.json());
  }catch(e){unthink();add('shelby',`<strong>⚠ DEMO FAILED</strong><br>${esc(String(e))}`);}
  finally{loading=false;setBusy(false);document.getElementById('demo-btn').disabled=false;}
}
function scorecard(d){
  const dims=Object.keys(d.after.dimensions), delta=(d.after.overall-d.before.overall).toFixed(1);
  const rows=dims.map(k=>`<div class="row"><div class="dim">${k.replace('_',' ')}</div><div class="track"><div class="fill" data-to="${d.after.dimensions[k]}"></div></div><div class="rv">${d.after.dimensions[k].toFixed(0)}</div></div>`).join('');
  const defs=(d.defects||[]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('');
  const w=document.createElement('div'); w.className='msg shelby';
  w.innerHTML=`<div class="who">// shelby</div><div class="bubble card glass">
    <div class="ct">▚ DATA-QUALITY FDE LOOP</div>
    <div class="cs">two broken source exports (customers × orders) — inspected, repaired, scored</div>
    <div class="ov"><div class="ovn"><span class="f">${d.before.overall.toFixed(1)}</span><span class="a">→</span><span class="t">${d.after.overall.toFixed(1)}</span></div><div class="delta">+${delta} PTS</div></div>
    ${rows}<ul class="defs">${defs}</ul>
    <div class="foot">auto-repaired; <b>${d.quarantined}</b> unrecoverable rows quarantined for review — not silently dropped.</div></div>`;
  chat.appendChild(w); sb(); spring(w,{opacity:[0,1],y:[10,0]},{});
  requestAnimationFrame(()=>setTimeout(()=>w.querySelectorAll('.fill').forEach(f=>{f.style.width=f.dataset.to+'%';}),90));
}

/* ── File upload → inspect CSV ──────────────────────────────── */
const fileInput=document.getElementById('file-input');
document.getElementById('file-btn').onclick=()=>fileInput.click();
fileInput.onchange=async()=>{
  const f=fileInput.files[0]; if(!f)return; fileInput.value='';
  if(loading)return; loading=true; setBusy(true);
  add('user',`📎 uploaded: ${f.name}`);
  think(`profiling ${esc(f.name)}`);
  try{
    const fd=new FormData(); fd.append('file',f);
    const r=await fetch('/inspect/upload',{method:'POST',body:fd}); unthink();
    const d=await r.json();
    if(d.error){add('shelby',`<strong>⚠ ${esc(d.error)}</strong>`);}
    else fileReport(d);
  }catch(e){unthink();add('shelby',`<strong>⚠ UPLOAD FAILED</strong><br>${esc(String(e))}`);}
  finally{loading=false;setBusy(false);}
}
function fileReport(d){
  const s=d.scores, rows=[['completeness',s.completeness],['uniqueness',s.uniqueness]].map(([k,v])=>`<div class="row"><div class="dim">${k}</div><div class="track"><div class="fill" data-to="${v}"></div></div><div class="rv">${v.toFixed(0)}</div></div>`).join('');
  const issues=(d.issues||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li style="color:var(--lime)">✓ no obvious defects</li>';
  const w=document.createElement('div'); w.className='msg shelby';
  w.innerHTML=`<div class="who">// shelby</div><div class="bubble card glass">
    <div class="ct">▚ CSV INSPECTION // ${esc(d.filename)}</div>
    <div class="cs">generic data-quality profile of your uploaded file</div>
    <div class="kv"><div><span>${d.rows.toLocaleString()}</span><br>rows</div><div><span>${d.columns.length}</span><br>columns</div><div><span>${d.duplicate_rows}</span><br>dupes</div><div><span>${d.missing_cells.toLocaleString()}</span><br>missing</div></div>
    ${rows}<ul class="defs">${issues}</ul>
    <div class="foot">quality score: <b>${s.overall.toFixed(1)}</b> / 100 — ask me to repair it or explain any issue.</div></div>`;
  chat.appendChild(w); sb(); spring(w,{opacity:[0,1],y:[10,0]},{});
  requestAnimationFrame(()=>setTimeout(()=>w.querySelectorAll('.fill').forEach(f=>{f.style.width=f.dataset.to+'%';}),90));
}

/* ── Voice input (mic → STT) ────────────────────────────────── */
const micBtn=document.getElementById('mic-btn'); let rec=null, chunks=[];
micBtn.onclick=async()=>{
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  if(loading)return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(stream); chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{
      micBtn.classList.remove('rec'); stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:'audio/webm'});
      loading=true; setBusy(true); think('transcribing audio');
      try{
        const fd=new FormData(); fd.append('audio',blob,'rec.webm');
        const r=await fetch('/stt',{method:'POST',body:fd}); unthink();
        if(!r.ok){const x=await r.text().catch(()=>'');throw new Error(`${r.status} ${x.slice(0,120)}`);}
        const {text}=await r.json();
        loading=false; setBusy(false);
        input.value=text; send();
      }catch(e){unthink();loading=false;setBusy(false);add('shelby',`<strong>⚠ VOICE FAILED</strong><br>${esc(String(e))}`);}
    };
    rec.start(); micBtn.classList.add('rec');
  }catch(e){add('shelby',`<strong>⚠ MIC ACCESS DENIED</strong><br>${esc(String(e))}`);}
}

/* ── Wiring ─────────────────────────────────────────────────── */
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendBtn.onclick=send;
document.getElementById('demo-btn').onclick=demo;
document.getElementById('clear-btn').onclick=()=>{history=[];chat.innerHTML='';add('shelby',md(WELCOME));};
add('shelby',md(WELCOME)); input.focus();
</script>
