<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shelby</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c15f3c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial, Helvetica, sans-serif' font-weight='700' font-size='19' fill='%23ffffff'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a18;
  --muted: #8a887f;
  --faint: #b6b4ac;
  --border: #ececE8;
  --surface: #faf9f7;
  --user-bubble: #f3f2ee;
  --code-bg: #f6f5f2;
  --accent: #c15f3c;
  --accent-fg: #ffffff;
  --danger: #b23b3b;
  --ok: #3f8f5f;
  --binary: rgba(24, 150, 82, 0.14);
  --mono: 'Share Tech Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  --display: 'Orbitron', var(--mono);
}
:root[data-theme="dark"] {
  --bg: #141312;
  --fg: #ecebe6;
  --muted: #928f86;
  --faint: #55534d;
  --border: #2b2a26;
  --surface: #1d1c19;
  --user-bubble: #262420;
  --code-bg: #201f1b;
  --accent: #d3775a;
  --accent-fg: #141312;
  --danger: #e08585;
  --ok: #6fbf8f;
  --binary: rgba(72, 235, 140, 0.11);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* ── Binary field background (green, theme-aware) ───────────── */
#binary-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
  user-select: none; -webkit-user-select: none; padding: 6px 8px;
  font-family: var(--mono); font-size: 13px; line-height: 1.5; letter-spacing: 3px;
  color: var(--binary); word-break: break-all; white-space: normal; transition: color .25s ease; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  transition: background .25s ease, color .25s ease;
}
#app { display: flex; flex-direction: column; height: 100vh; max-width: 780px; margin: 0 auto; }

/* ── Header ─────────────────────────────────────────────────── */
.header { display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 58px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.hl { display: flex; align-items: center; gap: 11px; }
.logo-mark { width: 22px; height: 22px; color: var(--fg); }
.brand { font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: 2px; }
.status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); letter-spacing: .5px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.hbtns { display: flex; align-items: center; gap: 4px; }
.hbtn { font-family: var(--mono); background: none; border: 1px solid transparent; color: var(--muted);
  font-size: 12px; letter-spacing: .3px; padding: 6px 10px; border-radius: 7px; cursor: pointer; transition: all .14s; }
.hbtn:hover { color: var(--fg); background: var(--surface); }
.hbtn.primary { color: var(--fg); border-color: var(--border); }
.hbtn.primary:hover { border-color: var(--faint); }
.icon-btn { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent;
  background: none; color: var(--muted); cursor: pointer; transition: all .14s; }
.icon-btn:hover { color: var(--fg); background: var(--surface); }
.icon-btn svg { width: 17px; height: 17px; }
:root[data-theme="dark"] .sun { display: block; } :root[data-theme="dark"] .moon { display: none; }
.sun { display: none; } .moon { display: block; }

/* ── Chat ───────────────────────────────────────────────────── */
.chat { flex: 1; overflow-y: auto; padding: 30px 20px; display: flex; flex-direction: column; gap: 22px; }
.chat::-webkit-scrollbar { width: 8px; }
.chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.msg { display: flex; flex-direction: column; gap: 6px; }
.msg.user { align-items: flex-end; }
.msg.shelby { align-items: flex-start; }
.who { font-size: 11px; letter-spacing: .3px; color: var(--muted); padding: 0 2px; }
.bubble { max-width: min(88%, 640px); font-size: 14.5px; line-height: 1.72; word-break: break-word; }
.msg.user .bubble { background: var(--user-bubble); border: 1px solid var(--border);
  padding: 11px 15px; border-radius: 14px 14px 3px 14px; }
.msg.shelby .bubble { padding: 1px 0; }
.meta { font-size: 11px; color: var(--faint); padding-left: 2px; }
.enter { animation: enter .26s cubic-bezier(.2,.7,.2,1) both; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Markdown */
.bubble strong { color: var(--fg); font-weight: 700; }
.bubble em { font-style: italic; color: var(--muted); }
.bubble h1,.bubble h2,.bubble h3 { font-family: var(--display); font-weight: 600; letter-spacing: .5px; margin: 14px 0 6px; }
.bubble h1 { font-size: 1.12em; } .bubble h2 { font-size: 1.05em; } .bubble h3 { font-size: 1em; }
.bubble ul,.bubble ol { padding-left: 20px; margin: 7px 0; } .bubble li { margin: 4px 0; } .bubble p { margin: 8px 0; }
.bubble code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-size: .92em; }
.bubble pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 9px; padding: 13px 15px; margin: 10px 0; overflow-x: auto; }
.bubble pre code { background: none; border: none; padding: 0; }
.bubble a { color: var(--accent); text-underline-offset: 2px; }
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 13px 0; }
.bubble blockquote { border-left: 2px solid var(--border); padding: 2px 12px; margin: 8px 0; color: var(--muted); }

/* ── Thinking ───────────────────────────────────────────────── */
.think { display: flex; align-items: center; gap: 10px; padding: 2px 0; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: bob 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
@keyframes bob { 0%,100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
.tlabel { font-size: 13px; color: var(--muted); }

/* ── Card (scorecard / file report) ─────────────────────────── */
.card { max-width: min(92%, 640px); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; background: var(--surface); }
.card .ct { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .8px; }
.card .cs { font-size: 12px; color: var(--muted); margin: 5px 0 16px; }
.ov { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.ovn { font-family: var(--display); font-size: 24px; font-weight: 700; }
.ovn .f { color: var(--faint); } .ovn .a { color: var(--muted); margin: 0 8px; font-size: .8em; } .ovn .t { color: var(--accent); }
.delta { font-size: 11px; letter-spacing: .5px; color: var(--ok); border: 1px solid var(--border); padding: 3px 9px; border-radius: 6px; }
.row { display: grid; grid-template-columns: 108px 1fr 34px; align-items: center; gap: 12px; margin: 9px 0; }
.dim { font-size: 12px; color: var(--muted); }
.track { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.rv { font-size: 12px; text-align: right; color: var(--fg); }
.defs { margin-top: 13px; font-size: 12px; color: var(--muted); list-style: none; }
.defs li { margin: 5px 0; padding-left: 16px; position: relative; }
.defs li::before { content: "—"; position: absolute; left: 0; color: var(--faint); }
.foot { margin-top: 15px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 13px; }
.foot b { color: var(--fg); }
.kv { display: flex; gap: 22px; flex-wrap: wrap; margin: 6px 0 14px; }
.kv div { font-size: 12px; color: var(--muted); } .kv span { display: block; color: var(--fg); font-family: var(--display); font-size: 17px; margin-bottom: 2px; }

/* ── Input bar ──────────────────────────────────────────────── */
.inbar { display: flex; align-items: flex-end; gap: 8px; padding: 12px 18px;
  border: 1px solid var(--border); border-radius: 16px; margin: 0 18px 8px; background: var(--surface); transition: border-color .14s; }
.inbar:focus-within { border-color: var(--faint); }
.iobtn { width: 36px; height: 36px; border-radius: 9px; border: none; background: none; color: var(--muted);
  cursor: pointer; display: grid; place-items: center; flex-shrink: 0; transition: all .14s; }
.iobtn:hover { color: var(--fg); background: var(--bg); }
.iobtn svg { width: 18px; height: 18px; }
.iobtn.rec { color: var(--danger); }
@keyframes recpulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.iobtn.rec { animation: recpulse 1s ease-in-out infinite; }
#input { flex: 1; background: none; border: none; color: var(--fg); font-family: var(--mono); font-size: 14.5px;
  line-height: 1.55; padding: 8px 4px; resize: none; outline: none; min-height: 36px; max-height: 130px; }
#input::placeholder { color: var(--faint); }
#send { background: var(--accent); color: var(--accent-fg); }
#send:hover { filter: brightness(1.05); color: var(--accent-fg); background: var(--accent); }
#send:disabled { opacity: .4; cursor: not-allowed; }
.dl-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.dl-chip { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; font-family: var(--mono);
  font-size: 12.5px; color: var(--fg); border: 1px solid var(--border); background: var(--surface);
  padding: 7px 12px; border-radius: 9px; transition: all .14s; }
.dl-chip:hover { border-color: var(--faint); }
.dl-chip svg { width: 15px; height: 15px; color: var(--muted); }
.hint { text-align: center; font-size: 11px; color: var(--faint); padding: 0 16px 10px; flex-shrink: 0; }

/* ── Connectors modal ───────────────────────────────────────── */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px;
  background: rgba(20,19,18,.42); backdrop-filter: blur(3px); }
.modal[hidden] { display: none; }
.modal-card { width: min(540px, 100%); max-height: 86vh; overflow-y: auto; border-radius: 16px; padding: 22px 24px;
  background: var(--bg); border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,.18); }
.modal-card::-webkit-scrollbar { width: 8px; } .modal-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.modal-head { display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: 1px; }
.modal-x { background: none; border: 1px solid var(--border); color: var(--muted); width: 28px; height: 28px; border-radius: 8px;
  cursor: pointer; font-family: var(--mono); transition: all .14s; }
.modal-x:hover { color: var(--fg); border-color: var(--faint); }
.modal-sub { font-size: 12.5px; color: var(--muted); margin: 10px 0 18px; line-height: 1.6; }
.mcp-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 18px; }
.mcp-empty { font-size: 12.5px; color: var(--muted); padding: 14px; text-align: center; border: 1px dashed var(--border); border-radius: 10px; }
.mcp-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface); }
.mcp-item .mi-main { flex: 1; min-width: 0; }
.mcp-item .mi-name { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .5px; }
.mcp-item .mi-url { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
.mcp-item .mi-tags { display: flex; gap: 6px; margin-top: 6px; }
.mcp-tag { font-size: 10px; letter-spacing: .3px; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); }
.mcp-tag.on { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.mcp-tag.env { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.mi-del { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 11px;
  font-family: var(--mono); font-size: 11px; cursor: pointer; flex-shrink: 0; transition: all .14s; }
.mi-del:hover:not(:disabled) { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.mi-del:disabled { opacity: .4; cursor: not-allowed; }
.mcp-form { border-top: 1px solid var(--border); padding-top: 18px; }
.mcp-fields { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 13px; }
.mcp-in { flex: 1 1 150px; background: var(--surface); border: 1px solid var(--border); border-radius: 9px; color: var(--fg);
  font-family: var(--mono); font-size: 13px; padding: 10px 12px; outline: none; transition: border-color .14s; }
.mcp-in.wide { flex-basis: 100%; }
.mcp-in:focus { border-color: var(--faint); }
.mcp-in::placeholder { color: var(--faint); }
.mcp-msg { font-size: 12px; margin-top: 11px; min-height: 15px; }
.mcp-msg.ok { color: var(--ok); } .mcp-msg.err { color: var(--danger); }

@media (max-width: 640px) {
  .header { padding: 0 12px; height: 54px; }
  .status { display: none; }
  .brand { font-size: 15px; }
  .hl { gap: 9px; }
  .hbtns { gap: 2px; }
  .hbtn { padding: 6px 8px; font-size: 11.5px; }
  .icon-btn { width: 32px; height: 32px; }
  .chat { padding: 22px 14px; gap: 18px; }
  .bubble { max-width: 100%; font-size: 14px; }
  .card { max-width: 100%; }
  .inbar { margin: 0 10px 6px; padding: 9px 10px; }
  .hint { font-size: 10px; }
  .modal-card { padding: 18px 16px; border-radius: 14px; }
  .row { grid-template-columns: 92px 1fr 30px; gap: 9px; }
}
/* Very narrow phones: keep the two key actions, drop the least-used label. */
@media (max-width: 430px) {
  #binary-bg { font-size: 12px; letter-spacing: 2px; }
  #clear-btn { display: none; }
  .brand { letter-spacing: 1.5px; }
  .hbtn { padding: 6px 6px; font-size: 11px; }
}
</style>
</head>
<body>

<div id="binary-bg" aria-hidden="true"></div>

<div id="app">
  <header class="header">
    <div class="hl">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="28" height="28" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
        <text x="16" y="22" text-anchor="middle" font-family="Orbitron, sans-serif" font-weight="700" font-size="15" fill="currentColor">S</text>
      </svg>
      <div class="brand">SHELBY</div>
      <div class="status"><span class="dot"></span>online</div>
    </div>
    <div class="hbtns">
      <button id="mcp-btn" class="hbtn label">Connectors</button>
      <button id="demo-btn" class="hbtn label primary">Data-QC demo</button>
      <button id="clear-btn" class="hbtn label">Clear</button>
      <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="inbar">
    <input type="file" id="file-input" accept=".csv,.gz,text/csv,application/gzip" hidden>
    <button id="file-btn" class="iobtn" title="Upload a CSV to inspect">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <button id="mic-btn" class="iobtn" title="Record voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
    </button>
    <textarea id="input" placeholder="Message Shelby…" rows="1" maxlength="4000"></textarea>
    <button id="send" class="iobtn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for newline · powered by Claude</div>
</div>

<!-- ── Connectors modal ─────────────────────────────────────────── -->
<div id="mcp-modal" class="modal" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">Connectors</div>
      <button id="mcp-close" class="modal-x" aria-label="Close">✕</button>
    </div>
    <div class="modal-sub">Connect Shelby to any external service by its MCP server URL — like adding a connector in Claude. Its tools become available on the next message.</div>

    <div id="mcp-list" class="mcp-list"><div class="mcp-empty">loading…</div></div>

    <form id="mcp-form" class="mcp-form">
      <div class="mcp-fields">
        <input id="mcp-name" class="mcp-in" placeholder="name (e.g. notion)" autocomplete="off" required>
        <input id="mcp-url" class="mcp-in wide" placeholder="https://mcp.example.com/mcp" autocomplete="off" required>
        <input id="mcp-token" class="mcp-in" type="password" placeholder="token (optional)" autocomplete="off">
      </div>
      <button type="submit" id="mcp-add" class="hbtn primary">Connect</button>
      <div id="mcp-msg" class="mcp-msg"></div>
    </form>
  </div>
</div>

<script type="module">
/* Minimal entrance animation — no external libraries. */
function spring(el){ if(el) el.classList.add('enter'); }

/* Fill the green binary field to cover the viewport (continuous wrap). */
(function fillBinary(){
  const el=document.getElementById('binary-bg');
  const fit=()=>{
    const perRow=Math.ceil(window.innerWidth/16);   // ~one "01" group per 16px
    const rows=Math.ceil(window.innerHeight/20)+2;
    el.textContent='01 '.repeat(perRow*rows);
  };
  fit(); let t; window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(fit,150);});
})();

/* Theme (white / black), persisted. */
const root=document.documentElement;
const savedTheme=localStorage.getItem('shelby-theme')||'dark';
root.setAttribute('data-theme',savedTheme);
document.getElementById('theme-btn').onclick=()=>{
  const next=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',next); localStorage.setItem('shelby-theme',next);
};

const WELCOME = [
  "**Shelby** — a Claude-powered field agent with live web access, persistent memory, a dynamic skill system, and a data-quality repair loop.",
  "",
  "Ask me anything, **upload a CSV** to inspect, or **speak** your query. Run the **Data-QC demo** to watch me take a broken dataset from a failing score to 100.",
].join("\n");

let history = [], loading = false;

/* ── Markdown ───────────────────────────────────────────────── */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function md(raw){
  const B=[]; let t=raw.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{const i=B.length;B.push({l,c});return `\x02${i}\x02`;});
  t=esc(t); const I=[]; t=t.replace(/`([^`\n]+)`/g,(_,c)=>{const i=I.length;I.push(`<code>${esc(c)}</code>`);return `\x03${i}\x03`;});
  const L=t.split('\n'),o=[]; let ul=false;
  for(const ln of L){const s=ln.trim();
    if(/^### /.test(s)){if(ul){o.push('</ul>');ul=false;}o.push(`<h3>${s.slice(4)}</h3>`);continue;}
    if(/^## /.test(s)){if(ul){o.push('</ul>');ul=false;}o.push(`<h2>${s.slice(3)}</h2>`);continue;}
    if(/^# /.test(s)){if(ul){o.push('</ul>');ul=false;}o.push(`<h1>${s.slice(2)}</h1>`);continue;}
    if(/^(---|\*\*\*)$/.test(s)){if(ul){o.push('</ul>');ul=false;}o.push('<hr>');continue;}
    const b=s.match(/^[-*•+] (.+)/); if(b){if(!ul){o.push('<ul>');ul=true;}o.push(`<li>${b[1]}</li>`);continue;}
    const n=s.match(/^\d+\. (.+)/); if(n){if(!ul){o.push('<ul>');ul=true;}o.push(`<li>${n[1]}</li>`);continue;}
    if(ul&&!s){o.push('</ul>');ul=false;}
    if(/^&gt; /.test(s)){o.push(`<blockquote>${s.slice(5)}</blockquote>`);continue;}
    o.push(ln);
  }
  if(ul)o.push('</ul>'); t=o.join('\n');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  t=t.replace(/\n/g,'<br>').replace(/\x03(\d+)\x03/g,(_,i)=>I[i]).replace(/\x02(\d+)\x02/g,(_,i)=>`<pre><code>${esc(B[i].c.replace(/\n$/,''))}</code></pre>`);
  return t.replace(/<br>\s*(<(?:ul|ol|li|h[1-6]|pre|blockquote|hr)[^>]*>)/g,'$1').replace(/(<\/(?:ul|ol|li|h[1-6]|pre|blockquote)>)\s*<br>/g,'$1');
}

/* ── DOM ────────────────────────────────────────────────────── */
const chat=document.getElementById('chat');
const sb=()=>{chat.scrollTop=chat.scrollHeight;};
function add(role,htmlStr,meta){
  const w=document.createElement('div'); w.className=`msg ${role}`;
  const who=document.createElement('div'); who.className='who'; who.textContent=role==='user'?'You':'Shelby'; w.appendChild(who);
  const b=document.createElement('div'); b.className='bubble';
  if(role==='shelby')b.innerHTML=htmlStr; else b.textContent=htmlStr; w.appendChild(b);
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;w.appendChild(m);}
  chat.appendChild(w); sb();
  spring(w);
  return w;
}
function think(label){
  const w=document.createElement('div'); w.className='msg shelby'; w.id='think';
  w.innerHTML=`<div class="who">Shelby</div><div class="think"><span class="dots"><i></i><i></i><i></i></span><span class="tlabel">${label||'thinking'}</span></div>`;
  chat.appendChild(w); sb(); return w;
}
const unthink=()=>document.getElementById('think')?.remove();
function attachFiles(msgEl,files){
  if(!files||!files.length||!msgEl)return;
  const bubble=msgEl.querySelector('.bubble'); if(!bubble)return;
  const wrap=document.createElement('div'); wrap.className='dl-wrap';
  for(const f of files){
    const a=document.createElement('a'); a.className='dl-chip'; a.href=f.url; a.download=f.name;
    a.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>${esc(f.name)}</span>`;
    wrap.appendChild(a);
  }
  bubble.appendChild(wrap); sb();
}

/* ── Chat ───────────────────────────────────────────────────── */
const input=document.getElementById('input'), sendBtn=document.getElementById('send');
async function send(){
  if(loading)return; const text=input.value.trim(); if(!text)return;
  input.value=''; input.style.height='auto';
  add('user',text); history.push({role:'user',content:text});
  think('thinking'); loading=true; setBusy(true);
  const slow=setTimeout(()=>{const l=document.querySelector('#think .tlabel');if(l)l.textContent='searching the web';},6000);
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,stream:false})});
    clearTimeout(slow); unthink();
    if(!r.ok){const x=await r.text().catch(()=>r.statusText);throw new Error(`${r.status} ${x.slice(0,180)}`);}
    const d=await r.json(); const w=add('shelby',md(d.reply),`model: ${d.model}`); attachFiles(w,d.files); history.push({role:'assistant',content:d.reply});
  }catch(e){clearTimeout(slow);unthink();add('shelby',`<strong>Error</strong><br>${esc(String(e))}`);}
  finally{loading=false;setBusy(false);input.focus();}
}
function setBusy(b){sendBtn.disabled=b;}

/* ── Data-QC demo ───────────────────────────────────────────── */
async function demo(){
  if(loading)return; loading=true; setBusy(true); document.getElementById('demo-btn').disabled=true;
  add('user','run data-qc demo');
  think('inspect → repair → score');
  try{
    const r=await fetch('/demo/dataquality'); unthink();
    if(!r.ok)throw new Error(`${r.status}`);
    scorecard(await r.json());
  }catch(e){unthink();add('shelby',`<strong>Demo failed</strong><br>${esc(String(e))}`);}
  finally{loading=false;setBusy(false);document.getElementById('demo-btn').disabled=false;}
}
function scorecard(d){
  const dims=Object.keys(d.after.dimensions), delta=(d.after.overall-d.before.overall).toFixed(1);
  const rows=dims.map(k=>`<div class="row"><div class="dim">${k.replace('_',' ')}</div><div class="track"><div class="fill" data-to="${d.after.dimensions[k]}"></div></div><div class="rv">${d.after.dimensions[k].toFixed(0)}</div></div>`).join('');
  const defs=(d.defects||[]).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join('');
  const w=document.createElement('div'); w.className='msg shelby';
  w.innerHTML=`<div class="who">Shelby</div><div class="bubble card">
    <div class="ct">Data-quality FDE loop</div>
    <div class="cs">two broken source exports (customers × orders) — inspected, repaired, scored</div>
    <div class="ov"><div class="ovn"><span class="f">${d.before.overall.toFixed(1)}</span><span class="a">→</span><span class="t">${d.after.overall.toFixed(1)}</span></div><div class="delta">+${delta} pts</div></div>
    ${rows}<ul class="defs">${defs}</ul>
    <div class="foot">auto-repaired; <b>${d.quarantined}</b> unrecoverable rows quarantined for review — not silently dropped.</div></div>`;
  chat.appendChild(w); sb(); spring(w);
  requestAnimationFrame(()=>setTimeout(()=>w.querySelectorAll('.fill').forEach(f=>{f.style.width=f.dataset.to+'%';}),90));
}

/* ── File upload → inspect CSV ──────────────────────────────── */
const fileInput=document.getElementById('file-input');
document.getElementById('file-btn').onclick=()=>fileInput.click();
fileInput.onchange=async()=>{
  const f=fileInput.files[0]; if(!f)return; fileInput.value='';
  if(loading)return; loading=true; setBusy(true);
  add('user',`uploaded: ${f.name}`);
  think(`profiling ${esc(f.name)}`);
  try{
    const fd=new FormData(); fd.append('file',f);
    const r=await fetch('/inspect/upload',{method:'POST',body:fd}); unthink();
    const d=await r.json();
    if(d.error){add('shelby',`<strong>${esc(d.error)}</strong>`);}
    else fileReport(d);
  }catch(e){unthink();add('shelby',`<strong>Upload failed</strong><br>${esc(String(e))}`);}
  finally{loading=false;setBusy(false);}
}
function fileReport(d){
  const s=d.scores, rows=[['completeness',s.completeness],['uniqueness',s.uniqueness]].map(([k,v])=>`<div class="row"><div class="dim">${k}</div><div class="track"><div class="fill" data-to="${v}"></div></div><div class="rv">${v.toFixed(0)}</div></div>`).join('');
  const issues=(d.issues||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>no obvious defects</li>';
  const w=document.createElement('div'); w.className='msg shelby';
  w.innerHTML=`<div class="who">Shelby</div><div class="bubble card">
    <div class="ct">CSV inspection · ${esc(d.filename)}</div>
    <div class="cs">generic data-quality profile of your uploaded file</div>
    <div class="kv"><div><span>${d.rows.toLocaleString()}</span>rows</div><div><span>${d.columns.length}</span>columns</div><div><span>${d.duplicate_rows}</span>dupes</div><div><span>${d.missing_cells.toLocaleString()}</span>missing</div></div>
    ${rows}<ul class="defs">${issues}</ul>
    <div class="foot">quality score: <b>${s.overall.toFixed(1)}</b> / 100 — ask me to repair it or explain any issue.</div></div>`;
  chat.appendChild(w); sb(); spring(w);
  requestAnimationFrame(()=>setTimeout(()=>w.querySelectorAll('.fill').forEach(f=>{f.style.width=f.dataset.to+'%';}),90));
}

/* ── Voice input (mic → STT) ────────────────────────────────── */
const micBtn=document.getElementById('mic-btn'); let rec=null, chunks=[];
micBtn.onclick=async()=>{
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  if(loading)return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(stream); chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{
      micBtn.classList.remove('rec'); stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:'audio/webm'});
      loading=true; setBusy(true); think('transcribing audio');
      try{
        const fd=new FormData(); fd.append('audio',blob,'rec.webm');
        const r=await fetch('/stt',{method:'POST',body:fd}); unthink();
        if(!r.ok){const x=await r.text().catch(()=>'');throw new Error(`${r.status} ${x.slice(0,120)}`);}
        const {text}=await r.json();
        loading=false; setBusy(false);
        input.value=text; send();
      }catch(e){unthink();loading=false;setBusy(false);add('shelby',`<strong>Voice failed</strong><br>${esc(String(e))}`);}
    };
    rec.start(); micBtn.classList.add('rec');
  }catch(e){add('shelby',`<strong>Mic access denied</strong><br>${esc(String(e))}`);}
}

/* ── Connectors (MCP) ───────────────────────────────────────── */
const mcpModal=document.getElementById('mcp-modal');
const mcpList=document.getElementById('mcp-list');
const mcpMsg=document.getElementById('mcp-msg');
function mcpSetMsg(t,ok){mcpMsg.textContent=t||'';mcpMsg.className='mcp-msg'+(t?(ok?' ok':' err'):'');}
async function mcpLoad(){
  mcpList.innerHTML='<div class="mcp-empty">loading…</div>';
  try{
    const r=await fetch('/mcp'); const d=await r.json(); const servers=d.servers||[];
    if(!servers.length){mcpList.innerHTML='<div class="mcp-empty">no services connected yet — add one below</div>';return;}
    mcpList.innerHTML='';
    for(const s of servers){
      const isEnv=s.source==='environment';
      const el=document.createElement('div'); el.className='mcp-item';
      el.innerHTML=`<div class="mi-main">
          <div class="mi-name">${esc(s.name)}</div>
          <div class="mi-url">${esc(s.url)}</div>
          <div class="mi-tags">
            <span class="mcp-tag ${s.authenticated?'on':''}">${s.authenticated?'authenticated':'no-auth'}</span>
            <span class="mcp-tag ${isEnv?'env':''}">${esc(s.source)}</span>
          </div>
        </div>
        <button class="mi-del" ${isEnv?'disabled title="set via environment — remove it there"':''}>${isEnv?'locked':'remove'}</button>`;
      if(!isEnv){el.querySelector('.mi-del').onclick=()=>mcpRemove(s.name);}
      mcpList.appendChild(el);
    }
  }catch(e){mcpList.innerHTML=`<div class="mcp-empty">could not load: ${esc(String(e))}</div>`;}
}
async function mcpRemove(name){
  mcpSetMsg('');
  try{
    const r=await fetch('/mcp/'+encodeURIComponent(name),{method:'DELETE'});
    if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.detail||r.status);}
    mcpSetMsg(`disconnected ${name}`,true); mcpLoad();
  }catch(e){mcpSetMsg(String(e).replace('Error: ',''),false);}
}
document.getElementById('mcp-form').addEventListener('submit',async e=>{
  e.preventDefault(); mcpSetMsg('');
  const name=document.getElementById('mcp-name').value.trim();
  const url=document.getElementById('mcp-url').value.trim();
  const token=document.getElementById('mcp-token').value.trim();
  const btn=document.getElementById('mcp-add'); btn.disabled=true;
  try{
    const body={name,url}; if(token)body.token=token;
    const r=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.detail||r.status);}
    mcpSetMsg(`connected ${name} — its tools are live now`,true);
    document.getElementById('mcp-name').value=''; document.getElementById('mcp-url').value=''; document.getElementById('mcp-token').value='';
    mcpLoad();
  }catch(e){mcpSetMsg(String(e).replace('Error: ',''),false);}
  finally{btn.disabled=false;}
});
function mcpOpen(){mcpModal.hidden=false;mcpSetMsg('');mcpLoad();}
function mcpCloseFn(){mcpModal.hidden=true;}
document.getElementById('mcp-btn').onclick=mcpOpen;
document.getElementById('mcp-close').onclick=mcpCloseFn;
mcpModal.addEventListener('click',e=>{if(e.target===mcpModal)mcpCloseFn();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!mcpModal.hidden)mcpCloseFn();});

/* ── Wiring ─────────────────────────────────────────────────── */
input.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendBtn.onclick=send;
document.getElementById('demo-btn').onclick=demo;
document.getElementById('clear-btn').onclick=()=>{history=[];chat.innerHTML='';add('shelby',md(WELCOME));};
add('shelby',md(WELCOME)); input.focus();
</script>
