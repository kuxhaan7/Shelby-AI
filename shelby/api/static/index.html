<title>Shelby AI — Live Demo</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #060610;
  --bg-2: #0a0a18;
  --glass: rgba(255,255,255,0.045);
  --glass-strong: rgba(255,255,255,0.07);
  --glass-border: rgba(255,255,255,0.10);
  --violet: #a855f7;
  --indigo: #818cf8;
  --cyan: #22d3ee;
  --text: #e6e8f0;
  --muted: #7b7f99;
  --user-bg: rgba(59,90,180,0.22);
  --user-border: rgba(96,140,255,0.35);
  --good: #34d399;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background:
    radial-gradient(1100px 600px at 15% -10%, rgba(168,85,247,0.16), transparent 60%),
    radial-gradient(900px 600px at 100% 0%, rgba(34,211,238,0.10), transparent 55%),
    var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
#app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; }

/* ── Glass helper ──────────────────────────────────────────── */
.glass {
  background: var(--glass);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid var(--glass-border);
}

/* ── Header ────────────────────────────────────────────────── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px; height: 60px; flex-shrink: 0;
  border-bottom: 1px solid var(--glass-border);
  background: rgba(6,6,16,0.72);
  backdrop-filter: blur(14px);
}
.header-left { display: flex; align-items: center; gap: 11px; }
.logo-mark { width: 30px; height: 30px; filter: drop-shadow(0 0 6px rgba(168,85,247,0.7)); animation: breathe 4s ease-in-out infinite; }
@keyframes breathe { 0%,100% { filter: drop-shadow(0 0 4px rgba(168,85,247,0.5)); } 50% { filter: drop-shadow(0 0 10px rgba(168,85,247,0.95)); } }
.logo-text { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.logo-text b { background: linear-gradient(90deg, var(--violet), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.live-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 9px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--good); border: 1px solid rgba(52,211,153,0.4);
  padding: 3px 8px; border-radius: 20px;
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 6px var(--good); animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.caps { display: flex; gap: 6px; flex-wrap: wrap; margin-left: 4px; }
.cap { font-size: 11px; color: var(--muted); border: 1px solid var(--glass-border); padding: 2px 9px; border-radius: 20px; }
.header-btns { display: flex; gap: 8px; }
.hbtn {
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text);
  font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  transition: border-color .15s, background .15s; white-space: nowrap;
}
.hbtn:hover { border-color: rgba(168,85,247,0.6); background: rgba(168,85,247,0.10); }
.hbtn.primary { border-color: rgba(168,85,247,0.5); background: rgba(168,85,247,0.14); color: #e9d5ff; }
.hbtn.ghost { color: var(--muted); }

/* ── Chat area ─────────────────────────────────────────────── */
.chat-area { flex: 1; overflow-y: auto; padding: 28px 20px; display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth; }
.chat-area::-webkit-scrollbar { width: 6px; }
.chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

.message { display: flex; flex-direction: column; gap: 4px; animation: rise .28s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.message.user { align-items: flex-end; }
.message.shelby { align-items: flex-start; }
.bubble { max-width: min(80%, 660px); padding: 12px 16px; border-radius: 16px; font-size: 14.5px; line-height: 1.65; word-break: break-word; }
.message.user .bubble { background: var(--user-bg); border: 1px solid var(--user-border); border-bottom-right-radius: 5px; }
.message.shelby .bubble {
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(12px); border-bottom-left-radius: 5px;
}
.meta { font-size: 10.5px; color: var(--muted); padding-left: 3px; letter-spacing: 0.02em; }

/* Markdown */
.bubble strong { font-weight: 600; color: #f3f4f9; }
.bubble em { font-style: italic; color: #cbd0e0; }
.bubble h1,.bubble h2,.bubble h3 { margin: 10px 0 4px; font-weight: 700; color: #f3f4f9; }
.bubble h1 { font-size: 1.15em; } .bubble h2 { font-size: 1.06em; } .bubble h3 { font-size: 1em; }
.bubble ul,.bubble ol { padding-left: 22px; margin: 6px 0; }
.bubble li { margin: 3px 0; } .bubble p { margin: 6px 0; }
.bubble code { background: rgba(10,10,26,0.8); border: 1px solid rgba(129,140,248,0.25); border-radius: 4px; padding: 1px 5px; font-family: ui-monospace,'JetBrains Mono',monospace; font-size: 13px; color: #c4b5fd; }
.bubble pre { background: rgba(6,6,18,0.9); border: 1px solid var(--glass-border); border-radius: 10px; padding: 14px 16px; margin: 10px 0; overflow-x: auto; }
.bubble pre code { background: none; border: none; padding: 0; color: #c4b5fd; }
.bubble a { color: var(--indigo); text-decoration: underline; }
.bubble blockquote { border-left: 3px solid var(--violet); padding: 4px 12px; margin: 6px 0; color: var(--muted); font-style: italic; }
.bubble hr { border: none; border-top: 1px solid var(--glass-border); margin: 12px 0; }

/* ── Communicating animation (the emblem) ──────────────────── */
.thinking-wrap { display: flex; align-items: center; gap: 14px; padding: 6px 4px; }
.emblem-stage { position: relative; width: 54px; height: 54px; flex-shrink: 0; display: grid; place-items: center; }
.emblem-ring {
  position: absolute; inset: -4px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent, var(--violet), var(--cyan), transparent 75%);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
          mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
  animation: spin 1.5s linear infinite; opacity: 0.9;
}
@keyframes spin { to { transform: rotate(360deg); } }
.emblem-core { width: 40px; height: 40px; position: relative; z-index: 2; }
.emblem-core.active { animation: pulseGlow 1.1s ease-in-out infinite; }
@keyframes pulseGlow {
  0%,100% { filter: drop-shadow(0 0 3px rgba(168,85,247,0.6)); }
  50% { filter: drop-shadow(0 0 11px rgba(34,211,238,1)); }
}
.emblem-core .eye { animation: eyeFlicker 1.1s ease-in-out infinite; }
@keyframes eyeFlicker { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
.thinking-label {
  font-size: 13px; font-weight: 500;
  background: linear-gradient(90deg, var(--muted) 0%, #fff 50%, var(--muted) 100%);
  background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; animation: shimmer 2.2s linear infinite;
}
@keyframes shimmer { to { background-position: -200% center; } }

/* ── Scorecard card ────────────────────────────────────────── */
.scorecard { max-width: min(88%, 660px); border-radius: 16px; padding: 18px 20px; }
.sc-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.sc-title { font-size: 15px; font-weight: 700; }
.sc-sub { font-size: 11.5px; color: var(--muted); margin-bottom: 16px; }
.sc-overall { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.sc-big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sc-big .from { color: var(--muted); } .sc-big .arrow { color: var(--violet); margin: 0 8px; } .sc-big .to { background: linear-gradient(90deg, var(--violet), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.sc-delta { font-size: 12px; font-weight: 700; color: var(--good); border: 1px solid rgba(52,211,153,0.4); padding: 3px 9px; border-radius: 20px; }
.sc-row { display: grid; grid-template-columns: 96px 1fr 42px; align-items: center; gap: 10px; margin: 9px 0; }
.sc-dim { font-size: 12px; color: #c3c7db; text-transform: capitalize; }
.sc-track { height: 8px; border-radius: 6px; background: rgba(255,255,255,0.06); overflow: hidden; position: relative; }
.sc-fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--violet), var(--cyan)); transition: width 1.1s cubic-bezier(.2,.8,.2,1); box-shadow: 0 0 8px rgba(34,211,238,0.5); }
.sc-val { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; color: #c3c7db; }
.sc-foot { margin-top: 14px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--glass-border); padding-top: 12px; }
.sc-foot b { color: #c3c7db; }
.sc-defects { margin-top: 10px; font-size: 11.5px; color: var(--muted); }
.sc-defects li { margin: 3px 0; }

/* ── Input bar ─────────────────────────────────────────────── */
.input-bar { display: flex; align-items: flex-end; gap: 10px; padding: 12px 20px 16px; border-top: 1px solid var(--glass-border); flex-shrink: 0; background: rgba(6,6,16,0.72); backdrop-filter: blur(14px); }
#input { flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 13px; color: var(--text); font-family: inherit; font-size: 14.5px; line-height: 1.5; padding: 11px 15px; resize: none; outline: none; min-height: 46px; max-height: 130px; transition: border-color .15s, box-shadow .15s; }
#input:focus { border-color: rgba(168,85,247,0.6); box-shadow: 0 0 0 3px rgba(168,85,247,0.14); }
#input::placeholder { color: var(--muted); }
#send-btn { width: 46px; height: 46px; border-radius: 13px; background: linear-gradient(135deg, var(--violet), var(--indigo)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .15s, transform .1s; box-shadow: 0 4px 16px rgba(168,85,247,0.35); }
#send-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
#send-btn:not(:disabled):active { transform: scale(0.93); }
#send-btn svg { width: 19px; height: 19px; }
.hint { text-align: center; font-size: 11px; color: var(--muted); padding: 0 20px 8px; flex-shrink: 0; }

@media (max-width: 620px) {
  .caps { display: none; }
  .bubble, .scorecard { max-width: 93%; }
  .chat-area { padding: 16px 14px; }
  .cap-demo-label { display: none; }
}
</style>

<!-- Inline emblem symbol: an original angular sentinel sigil (Decepticon aesthetic, not the trademarked mark) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="emblemGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <symbol id="shelby-emblem" viewBox="0 0 100 100">
      <!-- crown / brow -->
      <path d="M50 10 L86 26 L78 40 L62 33 L50 24 L38 33 L22 40 L14 26 Z" fill="url(#emblemGrad)"/>
      <!-- angular eyes -->
      <path class="eye" d="M30 44 L46 50 L42 60 L29 55 Z" fill="url(#emblemGrad)"/>
      <path class="eye" d="M70 44 L54 50 L58 60 L71 55 Z" fill="url(#emblemGrad)"/>
      <!-- jaw / fangs -->
      <path d="M34 64 L50 70 L66 64 L58 88 L50 78 L42 88 Z" fill="url(#emblemGrad)"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <header class="header">
    <div class="header-left">
      <svg class="logo-mark"><use href="#shelby-emblem"/></svg>
      <div class="logo-text">Shel<b>by</b></div>
      <div class="live-badge"><span class="live-dot"></span>Live</div>
      <div class="caps">
        <span class="cap">Web Search</span>
        <span class="cap">Memory</span>
        <span class="cap">Skills</span>
        <span class="cap">Data Quality</span>
      </div>
    </div>
    <div class="header-btns">
      <button id="demo-btn" class="hbtn primary">⚡ <span class="cap-demo-label">Data-Quality Demo</span></button>
      <button id="clear-btn" class="hbtn ghost">Clear</button>
    </div>
  </header>

  <div class="chat-area" id="chat-area"></div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask Shelby anything — it searches the web in real time…" rows="1" maxlength="4000"></textarea>
    <button id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for newline · Powered by Claude + ElevenLabs</div>
</div>

<script>
const WELCOME = [
  "Hey, I'm **Shelby** — a Claude-powered AI agent built as a live FDE role demo.",
  "",
  "I don't say *I don't know* — I have live web access and use it before answering.",
  "",
  "**What I can do:**",
  "- 🔍 **Search the web** in real time (Tavily)",
  "- 🧠 **Write & read memory** — I learn and remember across sessions",
  "- ⚙️ **Build & run skills** — I write Python to solve novel problems",
  "- 🧹 **Fix broken data** — inspect → clean → score, the real FDE loop",
  "",
  "**Try this:** hit **⚡ Data-Quality Demo** above to watch me take a broken enterprise dataset from a failing quality score to 100 — or just ask me anything.",
].join("\n");

let history = [];
let loading = false;

/* ── Markdown ───────────────────────────────────────────────── */
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderMarkdown(raw){
  const blocks=[]; let text=raw.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{const i=blocks.length;blocks.push({lang:l||'',code:c});return `\x02B${i}\x02`;});
  text=escapeHtml(text);
  const inl=[]; text=text.replace(/`([^`\n]+)`/g,(_,c)=>{const i=inl.length;inl.push(`<code>${escapeHtml(c)}</code>`);return `\x03I${i}\x03`;});
  const lines=text.split('\n'); const out=[]; let inList=false;
  for(const line of lines){
    const t=line.trim();
    if(/^### /.test(t)){if(inList){out.push('</ul>');inList=false;}out.push(`<h3>${t.slice(4)}</h3>`);continue;}
    if(/^## /.test(t)){if(inList){out.push('</ul>');inList=false;}out.push(`<h2>${t.slice(3)}</h2>`);continue;}
    if(/^# /.test(t)){if(inList){out.push('</ul>');inList=false;}out.push(`<h1>${t.slice(2)}</h1>`);continue;}
    if(/^(---|\*\*\*)$/.test(t)){if(inList){out.push('</ul>');inList=false;}out.push('<hr>');continue;}
    const b=t.match(/^[-*•+] (.+)/); if(b){if(!inList){out.push('<ul>');inList=true;}out.push(`<li>${b[1]}</li>`);continue;}
    const n=t.match(/^\d+\. (.+)/); if(n){if(!inList){out.push('<ul>');inList=true;}out.push(`<li>${n[1]}</li>`);continue;}
    if(inList&&!t){out.push('</ul>');inList=false;}
    if(/^&gt; /.test(t)){out.push(`<blockquote>${t.slice(5)}</blockquote>`);continue;}
    out.push(line);
  }
  if(inList)out.push('</ul>');
  text=out.join('\n');
  text=text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/__(.+?)__/g,'<strong>$1</strong>');
  text=text.replace(/\n/g,'<br>');
  text=text.replace(/\x03I(\d+)\x03/g,(_,i)=>inl[i]);
  text=text.replace(/\x02B(\d+)\x02/g,(_,i)=>{const{lang,code}=blocks[i];return `<pre><code class="lang-${escapeHtml(lang)}">${escapeHtml(code.replace(/\n$/,''))}</code></pre>`;});
  text=text.replace(/<br>\s*(<(?:ul|ol|li|h[1-6]|pre|blockquote|hr)[^>]*>)/g,'$1').replace(/(<\/(?:ul|ol|li|h[1-6]|pre|blockquote)>)\s*<br>/g,'$1');
  return text;
}

/* ── DOM ────────────────────────────────────────────────────── */
const chatArea=document.getElementById('chat-area');
function scrollBottom(){chatArea.scrollTop=chatArea.scrollHeight;}
function addMessage(role,html,meta){
  const w=document.createElement('div'); w.className=`message ${role}`;
  const b=document.createElement('div'); b.className='bubble';
  if(role==='shelby')b.innerHTML=html; else b.textContent=html;
  w.appendChild(b);
  if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;w.appendChild(m);}
  chatArea.appendChild(w); scrollBottom(); return w;
}
function emblemSVG(active){return `<div class="emblem-stage"><div class="emblem-ring"></div><svg class="emblem-core ${active?'active':''}"><use href="#shelby-emblem"/></svg></div>`;}
function addThinking(){
  const w=document.createElement('div'); w.className='message shelby'; w.id='thinking-msg';
  w.innerHTML=`<div class="thinking-wrap">${emblemSVG(true)}<span class="thinking-label" id="thinking-label">Shelby is thinking…</span></div>`;
  chatArea.appendChild(w); scrollBottom(); return w;
}
function removeThinking(){document.getElementById('thinking-msg')?.remove();}

/* ── Chat send ──────────────────────────────────────────────── */
const inputEl=document.getElementById('input'), sendBtn=document.getElementById('send-btn');
async function send(){
  if(loading)return; const text=inputEl.value.trim(); if(!text)return;
  inputEl.value=''; inputEl.style.height='auto';
  addMessage('user',text); history.push({role:'user',content:text});
  addThinking(); loading=true; sendBtn.disabled=true;
  const slow=setTimeout(()=>{const l=document.getElementById('thinking-label');if(l)l.textContent='Using tools — searching…';},6000);
  try{
    const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,stream:false})});
    clearTimeout(slow); removeThinking();
    if(!res.ok){const bd=await res.text().catch(()=>res.statusText);throw new Error(`${res.status} — ${bd.slice(0,200)}`);}
    const data=await res.json();
    addMessage('shelby',renderMarkdown(data.reply),data.model);
    history.push({role:'assistant',content:data.reply});
  }catch(err){clearTimeout(slow);removeThinking();addMessage('shelby',`<strong>⚠️ Error</strong><br>${escapeHtml(String(err))}`);}
  finally{loading=false;sendBtn.disabled=false;inputEl.focus();}
}

/* ── Data-Quality demo ──────────────────────────────────────── */
const demoBtn=document.getElementById('demo-btn');
async function runDemo(){
  if(loading)return; loading=true; demoBtn.disabled=true; sendBtn.disabled=true;
  addMessage('user','Run the data-quality demo');
  const w=document.createElement('div'); w.className='message shelby'; w.id='thinking-msg';
  w.innerHTML=`<div class="thinking-wrap">${emblemSVG(true)}<span class="thinking-label">Inspecting → fixing → scoring broken data…</span></div>`;
  chatArea.appendChild(w); scrollBottom();
  try{
    const res=await fetch('/demo/dataquality');
    removeThinking();
    if(!res.ok)throw new Error(`${res.status}`);
    const d=await res.json();
    renderScorecard(d);
  }catch(err){removeThinking();addMessage('shelby',`<strong>⚠️ Demo failed</strong><br>${escapeHtml(String(err))}`);}
  finally{loading=false;demoBtn.disabled=false;sendBtn.disabled=false;}
}

function renderScorecard(d){
  const dims=Object.keys(d.after.dimensions);
  const delta=(d.after.overall-d.before.overall).toFixed(1);
  const rows=dims.map(dim=>`
    <div class="sc-row">
      <div class="sc-dim">${dim.replace('_',' ')}</div>
      <div class="sc-track"><div class="sc-fill" data-to="${d.after.dimensions[dim]}"></div></div>
      <div class="sc-val">${d.after.dimensions[dim].toFixed(0)}</div>
    </div>`).join('');
  const defects=(d.defects||[]).slice(0,4).map(x=>`<li>✗ ${escapeHtml(x)}</li>`).join('');
  const w=document.createElement('div'); w.className='message shelby';
  w.innerHTML=`
    <div class="bubble scorecard glass">
      <div class="sc-head"><span class="sc-title">🧹 Data-Quality FDE Loop</span></div>
      <div class="sc-sub">Two broken source-system exports (customers × orders) — inspected, cleaned, and scored.</div>
      <div class="sc-overall">
        <div class="sc-big"><span class="from">${d.before.overall.toFixed(1)}</span><span class="arrow">→</span><span class="to">${d.after.overall.toFixed(1)}</span></div>
        <div class="sc-delta">+${delta} pts</div>
      </div>
      ${rows}
      <ul class="sc-defects">${defects}</ul>
      <div class="sc-foot">Fixed automatically; <b>${d.quarantined}</b> unrecoverable rows quarantined for customer review — not silently dropped.</div>
    </div>`;
  chatArea.appendChild(w); scrollBottom();
  requestAnimationFrame(()=>{setTimeout(()=>{w.querySelectorAll('.sc-fill').forEach(f=>{f.style.width=f.dataset.to+'%';});},80);});
}

/* ── Wiring ─────────────────────────────────────────────────── */
inputEl.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px';});
inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
sendBtn.addEventListener('click',send);
demoBtn.addEventListener('click',runDemo);
document.getElementById('clear-btn').addEventListener('click',()=>{history=[];chatArea.innerHTML='';addMessage('shelby',renderMarkdown(WELCOME));});

addMessage('shelby',renderMarkdown(WELCOME));
inputEl.focus();
</script>
